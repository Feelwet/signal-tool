name: Nightly update + deploy to GitHub Pages

# Triggers are ONLY schedule + workflow_dispatch (no `push`), so the bot commit of logs/categories.csv at the end of the
# build job can never re-trigger this workflow (and pushes made with GITHUB_TOKEN do not trigger workflows anyway).
on:
  schedule:
    - cron: "17 5 * * *"      # 05:17 UTC every day (07:17 Oslo summer time / 06:17 winter time)
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast run (skip Google Trends/earnings, cap SEC Form 4 scan)"
        type: boolean
        default: false

permissions:
  contents: write   # commit the forward log (logs/categories.csv) back to the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  TZ: Europe/Oslo
  PYTHONUNBUFFERED: "1"
  # SEC EDGAR asks for a contact in the User-Agent. Set a repository variable SIGNAL_UA ("Name email") to override.
  SIGNAL_UA: ${{ vars.SIGNAL_UA || format('signal-tool nightly (https://github.com/{0})', github.repository) }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # State between runs (GDELT daily aggregates, RSS/Reddit history = baselines, HTTP/Form 4 cache, snapshots)
      # lives in data/ and is carried over with actions/cache (never committed). Cache entries are immutable, so each
      # run saves a new key and restores the most recent one via restore-keys. If the cache is ever evicted
      # (unused > 7 days), the next run simply backfills 75 days of GDELT and RSS/Reddit baselines start over.
      - name: Restore state cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: signal-state-${{ github.run_id }}
          restore-keys: signal-state-

      - id: pages
        uses: actions/configure-pages@v5

      # The Kjøp/Hold/Watchlist forward log (logs/categories.csv) is the long-term track record. It is tracked in git
      # (checked out above, committed back at the end of this job). Fallback only if it is somehow missing: live site copy.
      - name: Restore forward log from live site if missing
        run: |
          mkdir -p logs
          if [ ! -s logs/categories.csv ]; then
            curl -fsSL "${{ steps.pages.outputs.base_url }}/historikk/kategorier.csv" -o logs/categories.csv \
              && echo "restored forward log ($(wc -l < logs/categories.csv) lines)" \
              || { rm -f logs/categories.csv; echo "no published forward log yet"; }
          fi
          echo "forward log: $(wc -l < logs/categories.csv 2>/dev/null || echo 0) lines"

      - name: Run pipeline (collect, score, report, build site)
        id: run
        continue-on-error: true   # individual sources may block GitHub IPs; collectors already degrade gracefully
        run: |
          if [ "${{ inputs.fast }}" = "true" ]; then python -m signaltool run --fast; else python -m signaltool run; fi

      - name: Fallback site build
        if: steps.run.outcome != 'success'
        run: |
          echo "::warning::Pipeline failed; rebuilding site from last available snapshot"
          if [ -f data/snapshots/latest.json ]; then
            python -m signaltool build-site
          else
            echo "::warning::No snapshot in cache; deploying the site/ committed in the repository"
            git checkout -- site
          fi
          test -f site/index.html

      - name: Prune state (keep cache small)
        if: always()
        run: |
          mkdir -p data
          find data/cache/gdelt_daily -type f -mtime +120 -delete 2>/dev/null || true
          find data/cache -maxdepth 1 -name 'http_*' -mtime +7 -delete 2>/dev/null || true
          find data/cache/form4 data/cache/house_ptr data/cache/insider_ds -type f -mtime +60 -delete 2>/dev/null || true
          find data/snapshots -name '20*.json' -mtime +90 -delete 2>/dev/null || true
          du -sh data || true

      - name: Save state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: signal-state-${{ github.run_id }}

      - name: Keep report with the site
        run: |
          mkdir -p site/rapport && cp reports/latest.md site/rapport/latest.md 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Persist the forward log in git. Only logs/categories.csv is staged (site/, reports/, data/ are left alone);
      # no commit if unchanged; "[skip ci]" as an extra guard against loops. Rebase + retry in case master moved.
      - name: Commit forward log
        if: always()
        continue-on-error: true   # a failed push must not block the Pages deploy (shows as an error annotation)
        run: |
          test -s logs/categories.csv || { echo "no forward log to commit"; exit 0; }
          git add logs/categories.csv
          if git diff --cached --quiet -- logs/categories.csv; then
            echo "forward log unchanged - nothing to commit"; exit 0
          fi
          git -c user.name=GrokBot -c user.email=bot@box commit -m "Fremoverlogg: oppdatert $(date +%F) [skip ci]" -- logs/categories.csv
          for i in 1 2 3; do
            git -c user.name=GrokBot -c user.email=bot@box pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && { echo "forward log pushed ($(wc -l < logs/categories.csv) lines)"; exit 0; }
            sleep $((i * 5))
          done
          echo "::error::could not push forward log"; exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
